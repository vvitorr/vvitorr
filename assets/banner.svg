<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 270" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Scanline Beam Gradient -->
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0" />
      <stop offset="50%" stop-color="#39FF14" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0" />
    </linearGradient>

    <!-- CRT scanlines raster -->
    <pattern id="scanlines" width="100" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1" opacity="0.35" />
    </pattern>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="35%" stop-color="#39FF14" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#30363d" />
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <style>
    @keyframes scanbeam {
      0% { transform: translateY(-80px); }
      100% { transform: translateY(280px); }
    }
    @keyframes pulseGlow {
      0%, 100% {
        filter: drop-shadow(0 0 2px #39FF14) drop-shadow(0 0 8px rgba(57, 255, 20, 0.45));
        opacity: 0.95;
      }
      50% {
        filter: drop-shadow(0 0 5px #39FF14) drop-shadow(0 0 16px rgba(57, 255, 20, 0.85));
        opacity: 1;
      }
    }
    @keyframes subtleGlitch {
      0%, 94%, 100% { transform: translate(0, 0); }
      95% { transform: translate(-1.5px, 0.5px); }
      96% { transform: translate(1.5px, -0.5px); }
      97% { transform: translate(-0.8px, -0.5px); }
      98% { transform: translate(1px, 0.8px); }
    }
    @keyframes cursorBlink {
      0%, 45% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .ascii-text {
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      font-weight: 700;
      fill: #39FF14;
      white-space: pre;
      letter-spacing: -0.5px;
    }
    .pulse-layer {
      animation: pulseGlow 3.5s ease-in-out infinite;
    }
    .glitch-layer {
      animation: subtleGlitch 5.5s infinite;
    }
    .scanner {
      animation: scanbeam 4s linear infinite;
    }
    .cursor {
      animation: cursorBlink 0.9s infinite;
    }
  </style>

  <!-- Terminal Container Card -->
  <rect x="1" y="1" width="848" height="268" rx="10" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.2" />
  
  <!-- Subtle Background Grid -->
  <g opacity="0.04" stroke="#39FF14" stroke-width="0.8">
    <line x1="0" y1="40" x2="850" y2="40" />
    <line x1="0" y1="80" x2="850" y2="80" />
    <line x1="0" y1="120" x2="850" y2="120" />
    <line x1="0" y1="160" x2="850" y2="160" />
    <line x1="0" y1="200" x2="850" y2="200" />
    <line x1="0" y1="240" x2="850" y2="240" />
  </g>

  <!-- Terminal Titlebar -->
  <path d="M 1 10 C 1 5 5 1 10 1 L 840 1 C 845 1 849 5 849 10 L 849 34 L 1 34 Z" fill="#161b22" />
  <line x1="1" y1="34" x2="849" y2="34" stroke="#30363d" stroke-width="1" />
  
  <!-- Terminal Buttons -->
  <circle cx="22" cy="17" r="5" fill="#ff5f56" />
  <circle cx="39" cy="17" r="5" fill="#ffbd2e" />
  <circle cx="56" cy="17" r="5" fill="#27c93f" />

  <!-- Window title -->
  <text x="425" y="21" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11.5" letter-spacing="0.5">
    vvitorr@macos:~
  </text>

  <!-- Scanning beam over terminal body -->
  <g clip-path="url(#terminal-body-clip)">
    <clipPath id="terminal-body-clip">
      <rect x="2" y="35" width="846" height="232" rx="0" />
    </clipPath>
    <rect class="scanner" x="2" y="35" width="846" height="80" fill="url(#scan-grad)" pointer-events="none" />
    <!-- CRT raster lines overlay -->
    <rect x="2" y="35" width="846" height="232" fill="url(#scanlines)" pointer-events="none" />
  </g>

  <!-- Prompt command before ASCII art -->
  <g transform="translate(48, 62)">
    <text fill="#8b949e" font-family="ui-monospace, monospace" font-size="12" font-weight="600">
      <tspan fill="#39FF14">vvitorr@macos:~$</tspan> show banner motd
    </text>
  </g>

  <!-- Centered ASCII Art with Glow & Motion -->
  <g transform="translate(425, 96)">
    <g class="pulse-layer">
      <g class="glitch-layer">
        <text class="ascii-text" x="0" y="0" text-anchor="middle" xml:space="preserve">██╗   ██╗██╗████████╗ ██████╗ ██████╗ </text>
        <text class="ascii-text" x="0" y="16.5" text-anchor="middle" xml:space="preserve">██║   ██║██║╚══██╔══╝██╔═══██╗██╔══██╗</text>
        <text class="ascii-text" x="0" y="33" text-anchor="middle" xml:space="preserve">██║   ██║██║   ██║   ██║   ██║██████╔╝</text>
        <text class="ascii-text" x="0" y="49.5" text-anchor="middle" xml:space="preserve">╚██╗ ██╔╝██║   ██║   ██║   ██║██╔══██╗</text>
        <text class="ascii-text" x="0" y="66" text-anchor="middle" xml:space="preserve"> ╚████╔╝ ██║   ██║   ╚██████╔╝██║  ██║</text>
        <text class="ascii-text" x="0" y="82.5" text-anchor="middle" xml:space="preserve">  ╚═══╝  ╚═╝   ╚═╝    ╚═════╝ ╚═╝  ╚═╝</text>
      </g>
    </g>
  </g>

  <!-- Terminal active prompt line below ASCII art -->
  <g transform="translate(48, 230)">
    <text fill="#39FF14" font-family="ui-monospace, monospace" font-size="12" font-weight="700">vvitorr@macos:~$</text>
    <rect class="cursor" x="122" y="-11" width="8" height="14" fill="#39FF14" />
    <text fill="#8b949e" font-family="ui-monospace, monospace" font-size="11" x="142" y="0">[online &amp; ready]</text>
  </g>
</svg>
